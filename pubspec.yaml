name: task_manager_app
description: A professional Task Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Packages
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  animate_do: ^3.3.4
  shimmer: ^3.0.0

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.1

  # State Management
  provider: ^6.1.1

  # Notifications
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  csv: ^5.1.1
  image_picker: ^1.0.7
  fl_chart: ^0.66.2

  # Local Storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

